name: Publish KleenestOS OTA Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'app.config.ts'
      - '.github/workflows/ota-update.yml'

permissions:
  contents: read

concurrency:
  group: owner-production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify KleenestOS OTA credential
        run: test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is not configured in Kleenest_Owner" && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami --non-interactive
      - name: Verify authenticated KleenestOS source
        run: |
          grep -q 'getSession' app/_layout.tsx
          grep -q 'Redirect href="/auth"' app/_layout.tsx
          grep -q 'Owner Sign In' app/_layout.tsx
          node -e "import('./app.config.ts').catch(()=>process.exit(0))" || true
      - name: Publish KleenestOS OTA update
        run: npx eas-cli@latest update --channel owner-production --message "KleenestOS ${GITHUB_SHA}" --non-interactive
