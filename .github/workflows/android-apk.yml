name: Android Standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: owner-standalone-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean
      - name: Verify unused animation runtimes are not autolinked
        run: |
          ! grep -R -E 'react-native-reanimated|react-native-worklets' android/settings.gradle android/app/build.gradle android/gradle.properties 2>/dev/null
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build standalone release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release bundle contract
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/owner.bundle
          test -s /tmp/owner.bundle
          grep -a -q 'ssgesjzdvdsqacdtasje.supabase.co' /tmp/owner.bundle
          grep -a -q 'Kleenest Owner sign in' /tmp/owner.bundle
          ! grep -a -q 'Development Build' /tmp/owner.bundle
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
      - name: Android 16 release startup test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.kleenest.owner
            adb shell monkey -p com.kleenest.owner -c android.intent.category.LAUNCHER 1
            sleep 30
            test -n "$(adb shell pidof com.kleenest.owner | tr -d '\r' || true)" || (echo 'Owner APK exited during startup.' >&2; adb logcat -d -v threadtime | tail -n 1000 >&2; exit 1)
            adb shell dumpsys activity activities | grep -F com.kleenest.owner >/dev/null
            ! adb logcat -d -v threadtime | grep -E 'Process: com\.kleenest\.owner|FATAL EXCEPTION.*com\.kleenest\.owner|UnsatisfiedLinkError.*com\.kleenest\.owner'
      - name: Stage standalone APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Owner-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Owner-Standalone-APK
          path: Kleenest-Owner-Standalone.apk
          if-no-files-found: error
          retention-days: 30
