name: Retired — Owner Android Store pipeline

# KleenestOS has one production Android package: com.kleenest.platform.
# Ship all Android builds from Kleenest_Production/apps/platform-mobile.
# This repository remains the home of KleenestOS Web and the installable /mail client.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-owner-android:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Android release authority in Production
        run: |
          echo 'Retired: no Android package is built from Kleenest_Owner.'
          echo 'Canonical package: com.kleenest.platform.'
          echo 'Canonical workflow: Kleenest_Production/.github/workflows/android-family.yml.'
          echo 'Email parity is published to the Production Owner app and Kleenest Mail web client.'
